; NFSU2FixedHoodCam.ini
;
; Config is read once at startup. Restart the game after changing values.
;
; [Camera]
;   RemoveMovement=1 : rigidly attaches the hood camera to the car.
;                      1 = no positional/rotational inertia, 0 = vanilla.
;   HorizonLock=0    : 0 = camera follows the car's up vector and rolls with it.
;                      1 = horizon stays level (world up).
;
; [Audio]
;   CenterPlayer=1   : force the player car's audio pan to center (0).
;                      Respects OnlyHood: centered only in hood view when
;                      OnlyHood=1, or in every view when OnlyHood=0.

[General]
Enabled=1
OnlyHood=1
DebugLog=0

[Camera]
RemoveMovement=1
HorizonLock=0

[Audio]
CenterPlayer=1
